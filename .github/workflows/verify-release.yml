name: Verify PrivateBin Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact LPK release tag
        required: true
        default: v2.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: privatebin-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download exact Release asset on runner
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="community.lazycat.app.privatebin-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg
      - name: Verify artifact, ciphertext-only storage and config placement
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML==6.0.3'])
              import yaml

          name = os.environ['ASSET_NAME']
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')

          meta = json.loads(Path('release-metadata.json').read_text())
          assets = [a for a in meta['assets'] if a['name'] == name]
          assert len(assets) == 1, assets
          pkg = Path('verify-pkg') / name

          h = hashlib.sha256()
          with pkg.open('rb') as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                  h.update(chunk)
          assert 'sha256:' + h.hexdigest() == assets[0]['digest'], 'Release digest mismatch'

          with tarfile.open(pkg) as package:
              names = set(package.getnames())
              assert {'package.yml', 'manifest.yml', 'content.tar', 'icon.png'} <= names, names

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.privatebin'
              assert str(info['version']) == version
              assert info['name'] == 'PrivateBin'
              assert info['license'] == 'Zlib'
              assert str(info['min_os_version']) == '1.6.0'

              text = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(text)
              app = m['application']
              assert app['subdomain'] == 'privatebin'
              upstreams = app['upstreams']
              assert any(u['location'] == '/package-licenses/' and u['backend'].startswith('file://') for u in upstreams)
              assert any(u['location'] == '/' and u['backend'] == 'http://privatebin:8080/' for u in upstreams)
              assert 'public_path' not in app
              assert 'injects' not in app

              svc = m['services']['privatebin']
              assert svc['image'].startswith('docker.1ms.run/privatebin/nginx-fpm-alpine:')
              # Only the paste store is bound; nothing else from the image is replaced.
              assert svc['binds'] == ['/lzcapp/var/data:/srv/data'], svc['binds']
              assert svc['command'] == 'sh /lzcapp/pkg/content/start.sh'
              assert 'healthcheck' not in text
              assert 'lzc-file-chooser' not in text

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  members = content.getnames()

                  def read(target):
                      hits = [n for n in members if n.removeprefix('./') == target]
                      assert len(hits) == 1, (target, hits)
                      return content.extractfile(hits[0]).read().decode()

                  start = read('start.sh')
                  conf = read('conf.php')
                  lic = [n for n in members if 'licenses/' in n]
                  assert lic, members
                  license_text = content.extractfile(lic[0]).read().decode()

              # Storage must be the bound volume and filesystem-backed.
              assert "'ds' => 'files'" in conf
              assert "'path' => '/srv/data'" in conf
              assert "'dir' => '/srv/data'" in conf
              assert 'Filesystem' in conf
              # No secrets, sessions or database of its own are introduced.
              assert 'mysql' not in conf.lower()
              assert 'pgsql' not in conf.lower()

              # The config has to land where the image looks for it.
              assert '/srv/cfg/conf.php' in start
              assert 'cp /lzcapp/pkg/content/conf.php' in start
              assert 'exec /etc/init.d/rc.local' in start

              assert 'Zlib' in license_text or 'zlib' in license_text

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Independent cloud artifact verification\n\n' + json.dumps(result, indent=2) + '\n')
